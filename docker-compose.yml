version: "3.9"

services:
  sonic:
    build:
      context: .
      dockerfile: Dockerfile
    image: sonic:latest
    container_name: sonic-proxy
    restart: unless-stopped
    ports:
      - "8443:8443"
    volumes:
      - ./certs:/etc/sonic/certs
      - ./functions:/etc/sonic/functions
      - ./channelworkers.yaml:/etc/sonic/channelworkers.yaml
    environment:
      - SONIC_LISTEN_PORT=8443
      - SONIC_MODE=intercept
      - SONIC_RUNTIME_TIMEOUT_MS=50
      - SONIC_RUNTIME_POOL_SIZE=64
      - SONIC_RUNTIME_FAILSAFE=bypass
      - SONIC_LOG_LEVEL=info
    cap_add:
      - NET_ADMIN
      - SYS_RESOURCE
    network_mode: host
