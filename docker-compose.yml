services:
  sonic:
    build:
      context: .
      dockerfile: Dockerfile
    image: sonic:latest
    container_name: sonic-proxy
    restart: unless-stopped
    ports:
      - "8443:8443"
      - "9090:9090"
      - "9091:9091"
    volumes:
      - ./certs:/etc/sonic/certs
      - ./functions:/etc/sonic/functions
      - ./sonic.yaml:/etc/sonic/sonic.yaml
      - ./data:/etc/sonic/data
    environment:
      - SONIC_LISTEN_PORT=8443
      - SONIC_MODE=intercept
      - SONIC_RUNTIME_TIMEOUT_MS=50
      - SONIC_RUNTIME_POOL_SIZE=64
      - SONIC_RUNTIME_FAILSAFE=bypass
      - SONIC_LOG_LEVEL=info
      - SONIC_WEBUI_TOKEN=
    cap_add:
      - NET_ADMIN
      - SYS_RESOURCE
