<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonic Admin Web UI - CVE Scanner</title>
    <!-- Google Fonts: Outfit and Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">
</head>
<body>

    <div class="card" style="border-color: rgba(239, 68, 68, 0.25);">
        <div class="card-header" style="border-bottom-color: rgba(239, 68, 68, 0.15)">
            <h3 class="card-title" style="color: #ef4444; display: flex; align-items: center; gap: 0.35rem;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                Security Audit Log (CVE Scanner)
            </h3>
        </div>
        
        <div class="cve-list" id="cve-logs-container" style="display: flex; flex-direction: column; gap: 1rem; padding-top: 0.5rem;">
            <div class="no-alerts" style="text-align: center; color: var(--text-muted); padding: 3rem 0;">No CVE or vulnerability exploits detected.</div>
        </div>
    </div>

    <!-- Script no final do body para injeção de layout -->
    <script src="shared.js"></script>
    <script>
        window.onPageInit = function() {
            loadCVELogs();
        };

        window.onPagePoll = function() {
            loadCVELogs();
        };

        async function loadCVELogs() {
            const cves = await window.fetchData('/api/cves');
            updateCVELogs(cves);
        }

        function updateCVELogs(cves) {
            const container = document.getElementById('cve-logs-container');
            if (!container) return;

            if (!cves || cves.length === 0) {
                const emptyHTML = `<div class="no-alerts" style="text-align: center; color: var(--text-muted); padding: 3rem 0;">Nenhuma tentativa de exploit ou vulnerabilidade CVE detetada no tráfego.</div>`;
                if (container.innerHTML !== emptyHTML) container.innerHTML = emptyHTML;
                return;
            }

            const newHTML = cves.map(c => {
                const date = new Date(c.timestamp);
                const timeStr = date.toLocaleTimeString() + ' ' + date.toLocaleDateString();
                
                return `
                    <div class="cve-item" style="border: 1px solid rgba(239, 68, 68, 0.15); border-radius: 6px; padding: 1rem; background-color: #040406; display: flex; flex-direction: column; gap: 0.5rem;">
                        <div class="cve-item-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed var(--border-color); padding-bottom: 0.5rem;">
                            <span class="cve-tag" style="background-color: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); font-size: 0.65rem; font-weight: bold; padding: 0.15rem 0.45rem; border-radius: 4px; font-family: 'Outfit'; letter-spacing: 0.05em;">WAF BLOCKED</span>
                            <span class="cve-time" style="font-size: 0.75rem; color: var(--text-muted); font-family: monospace;">${timeStr}</span>
                        </div>
                        <div class="cve-pattern" style="font-size: 0.85rem; font-weight: 600; color: #f4f4f5; font-family: 'Outfit';">
                            Assinatura: <span style="font-weight: normal; color: var(--text-muted);">${window.escapeHTML(c.signature)}</span>
                        </div>
                        <div class="cve-preview" style="background-color: #000000; border: 1px solid var(--border-color); border-radius: 5px; padding: 0.75rem; font-family: monospace; font-size: 0.75rem; color: #e4e4e7; white-space: pre-wrap; word-break: break-all; max-height: 150px; overflow-y: auto; line-height: 1.4;">${window.escapeHTML(c.preview)}</div>
                    </div>
                `;
            }).join('');

            if (container.innerHTML !== newHTML) {
                container.innerHTML = newHTML;
            }
        }
    </script>
</body>
</html>
