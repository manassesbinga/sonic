<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonic Admin Web UI - Console Output</title>
    <!-- Google Fonts: Outfit and Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">
</head>
<body>

    <div class="card">
        <div class="card-header" style="flex-wrap: wrap; gap: 1rem;">
            <h3 class="card-title" style="display: flex; align-items: center; gap: 0.35rem;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--color-primary)"><path d="M18 10h-1.25A2.75 2.75 0 0 0 14 12.75v5A2.75 2.75 0 0 0 16.75 20.5H18M6 10h1.25A2.75 2.75 0 0 1 10 12.75v5A2.75 2.75 0 0 1 7.25 20.5H6"/></svg>
                Console Output Stream
            </h3>
            
            <div class="filter-group" style="display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; width: 100%; justify-content: space-between;">
                <div style="display: flex; gap: 0.5rem;">
                    <button id="filter-btn-all" class="filter-btn active" onclick="setLogLevelFilter('all')">All logs</button>
                    <button id="filter-btn-info" class="filter-btn" onclick="setLogLevelFilter('info')">Info</button>
                    <button id="filter-btn-warn" class="filter-btn" onclick="setLogLevelFilter('warn')">Warnings</button>
                    <button id="filter-btn-error" class="filter-btn" onclick="setLogLevelFilter('error')">Errors</button>
                </div>
                <input type="text" id="log-search" class="search-input" style="max-width: 300px; width: 100%;" placeholder="Pesquisar nos logs..." oninput="triggerLogSearch()">
            </div>
        </div>

        <div id="terminal-container" class="terminal" style="background-color: #020204; border: 1px solid var(--border-color); border-radius: 6px; padding: 1rem; font-family: monospace; font-size: 0.8rem; height: 500px; overflow-y: auto; display: flex; flex-direction: column; gap: 0.35rem;">
            <div class="no-logs" style="text-align: center; color: var(--text-muted); padding: 3rem 0;">Nenhum output de consola disponível. Aguardando eventos...</div>
        </div>
    </div>

    <!-- Script no final do body para injeção de layout -->
    <script src="shared.js"></script>
    <script>
        let activeLogLevel = 'all';

        window.onPageInit = function() {
            loadLogs();
        };

        window.onPagePoll = function() {
            loadLogs();
        };

        function setLogLevelFilter(level) {
            activeLogLevel = level;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`filter-btn-${level}`).classList.add('active');
            loadLogs();
        }

        function triggerLogSearch() {
            loadLogs();
        }

        async function loadLogs() {
            const logs = await window.fetchData('/api/logs');
            renderConsoleLogs(logs);
        }

        function renderConsoleLogs(logs) {
            const container = document.getElementById('terminal-container');
            if (!container) return;

            if (!logs || logs.length === 0) {
                const emptyHTML = `<div class="no-logs" style="text-align: center; color: var(--text-muted); padding: 3rem 0;">Nenhum output de consola disponível. Aguardando eventos...</div>`;
                if (container.innerHTML !== emptyHTML) container.innerHTML = emptyHTML;
                return;
            }

            const searchTerm = document.getElementById('log-search').value.toLowerCase();
            let filtered = logs.filter(l => {
                if (activeLogLevel !== 'all') {
                    // Converter níveis como 'warn' para 'WARN' ou 'warnings' para 'WARN'
                    const targetLvl = activeLogLevel === 'warn' ? 'WARN' : activeLogLevel.toUpperCase();
                    if (l.level !== targetLvl) return false;
                }
                if (searchTerm && !l.message.toLowerCase().includes(searchTerm)) {
                    return false;
                }
                return true;
            });

            if (filtered.length === 0) {
                const noMatchHTML = `<div class="no-logs" style="text-align: center; color: var(--text-muted); padding: 3rem 0;">Nenhum log corresponde aos filtros ativos.</div>`;
                container.innerHTML = noMatchHTML;
                return;
            }

            // Agrupar logs consecutivos idênticos
            let grouped = [];
            for (let item of filtered) {
                if (grouped.length > 0) {
                    let last = grouped[grouped.length - 1];
                    if (last.level === item.level && last.message === item.message) {
                        last.count = (last.count || 1) + 1;
                        last.timestamp = item.timestamp;
                        continue;
                    }
                }
                grouped.push({ ...item, count: 1 });
            }

            const shouldScroll = container.scrollHeight - container.clientHeight <= container.scrollTop + 60;

            const newHTML = grouped.map(l => {
                const date = new Date(l.timestamp);
                const timeStr = date.toLocaleTimeString() + '.' + String(date.getMilliseconds()).padStart(3, '0');
                const lvlClass = l.level.toLowerCase();
                const badge = l.count > 1 ? `<span class="log-badge" style="background: rgba(255, 255, 255, 0.05); color: #a1a1aa; border: 1px solid var(--border-color); padding: 0.05rem 0.3rem; border-radius: 4px; margin-left: 0.5rem; font-size: 0.65rem; display: inline-block; vertical-align: middle;">x${l.count}</span>` : '';

                let levelBadgeClass = 'success';
                if (lvlClass === 'warn' || lvlClass === 'warning') levelBadgeClass = 'warning';
                if (lvlClass === 'error' || lvlClass === 'err') levelBadgeClass = 'error';

                return `
                    <div class="log-line" style="display: flex; gap: 0.5rem; align-items: flex-start; line-height: 1.5; font-family: monospace;">
                        <span style="color: #52525b; flex-shrink: 0;">[${timeStr}]</span>
                        <span class="status-badge ${levelBadgeClass}" style="width: auto; font-weight: bold; flex-shrink: 0; text-transform: uppercase; padding: 0.05rem 0.3rem; font-size: 0.6rem; border-radius: 3px;">${window.escapeHTML(l.level)}</span>
                        <span style="color: #e4e4e7; word-break: break-all; white-space: pre-wrap;">${window.escapeHTML(l.message)}${badge}</span>
                    </div>
                `;
            }).join('');

            if (container.innerHTML !== newHTML) {
                container.innerHTML = newHTML;
                if (shouldScroll) {
                    container.scrollTop = container.scrollHeight;
                }
            }
        }
    </script>
</body>
</html>
