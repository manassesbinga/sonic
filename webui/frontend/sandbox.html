<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonic Admin Web UI - Live Sandbox</title>
    <!-- Google Fonts: Outfit and Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">
</head>
<body>

    <div style="display: grid; grid-template-columns: 1fr; gap: 2rem;">
        
        <!-- Configuração do Sandbox -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--color-warning)"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>
                    Live Sandbox - Domínios Sob Interceptação
                </h3>
            </div>
            <div style="display: flex; flex-direction: column; gap: 1rem;">
                <div>
                    <label style="display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.25rem;">Domínios Interceptados (separados por vírgula, ex: *.exemplo.com, test.com)</label>
                    <input type="text" id="sandbox-domains-input" class="search-input" style="width: 100%;" placeholder="*.exemplo.com">
                </div>
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; cursor: pointer;">
                        <input type="checkbox" id="sandbox-active-check"> Habilitar Interceptação
                    </label>
                    <button class="auth-button" style="width: auto; padding: 0.5rem 1rem;" onclick="saveSandboxConfig()">Salvar</button>
                </div>
            </div>
        </div>

        <!-- Pedidos Pausados -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                    Pedidos Pausados no Breakpoint (Sandbox)
                </h3>
                <span id="sandbox-status-badge" class="badge" style="background-color: transparent; color: var(--text-color); border: 1px solid var(--border-color);">Esperando tráfego...</span>
            </div>

            <div class="form-grid-1to2">
                <!-- Coluna Esquerda: Lista de Transações -->
                <div style="border-right: 1px solid var(--border-color); padding-right: 1rem; max-height: 500px; overflow-y: auto;">
                    <div id="sandbox-tx-list" style="display: flex; flex-direction: column; gap: 0.5rem;">
                        <div style="text-align: center; color: var(--text-muted); padding: 2rem 0; font-size: 0.9rem;">Nenhuma conexão pausada.</div>
                    </div>
                </div>

                <!-- Coluna Direita: Editor Interativo -->
                <div id="sandbox-editor-panel" style="display: none; flex-direction: column; gap: 1rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">
                        <h4 style="font-family: 'Outfit'; font-size: 1.1rem; color: var(--color-primary);">Breakpoint Interativo - ID: <span id="sb-active-id">-</span></h4>
                        <span id="sb-active-type" class="status-badge success">Inbound Request</span>
                    </div>
                    <div class="form-grid-1to2">
                        <div>
                            <label style="display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.25rem;">Método</label>
                            <input type="text" id="sb-method" class="search-input" style="width: 100%;">
                        </div>
                        <div>
                            <label style="display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.25rem;">Caminho (Path/URL)</label>
                            <input type="text" id="sb-path" class="search-input" style="width: 100%;">
                        </div>
                    </div>
                    <div>
                        <label style="display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.25rem;">Cabeçalhos (JSON)</label>
                        <textarea id="sb-headers" class="search-input" style="width: 100%; height: 100px; font-family: monospace; font-size: 0.8rem; resize: vertical;"></textarea>
                    </div>
                    <div>
                        <label style="display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.25rem;">Corpo (Body)</label>
                        <textarea id="sb-body" class="search-input" style="width: 100%; height: 150px; font-family: monospace; font-size: 0.8rem; resize: vertical;"></textarea>
                    </div>

                    <!-- Resposta Direta no Breakpoint do Request -->
                    <div id="sb-direct-response-section" style="border: 1px dashed var(--border-color); padding: 1rem; border-radius: 5px; background: rgba(255, 255, 255, 0.01);">
                        <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; font-weight: bold; cursor: pointer; margin-bottom: 0.5rem;">
                            <input type="checkbox" id="sb-use-direct-resp" onchange="toggleDirectResponseFields()"> Responder Diretamente (Sem chamar upstream)
                        </label>
                        <div id="sb-direct-fields" style="display: none; flex-direction: column; gap: 0.75rem; margin-top: 0.75rem;">
                            <div class="form-grid-1to3">
                                <div>
                                    <label style="display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.25rem;">Status</label>
                                    <input type="number" id="sb-resp-status" class="search-input" style="width: 100%;" value="200">
                                </div>
                                <div>
                                    <label style="display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.25rem;">Content-Type</label>
                                    <input type="text" id="sb-resp-type" class="search-input" style="width: 100%;" value="application/json">
                                </div>
                            </div>
                            <div>
                                <label style="display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.25rem;">Corpo da Resposta</label>
                                <textarea id="sb-resp-body" class="search-input" style="width: 100%; height: 100px; font-family: monospace; font-size: 0.8rem; resize: vertical;" placeholder='{"status":"success"}'></textarea>
                            </div>
                        </div>
                    </div>

                    <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1rem;">
                        <button class="filter-btn" style="border-color: var(--color-error); color: var(--color-error);" onclick="sandboxAction('block')">Bloquear (403)</button>
                        <button class="filter-btn" style="border-color: var(--text-muted); color: var(--text-color);" onclick="sandboxAction('allow')">Passar Original</button>
                        <button class="auth-button" style="width: auto; padding: 0.5rem 1.5rem;" onclick="sandboxAction('modify')">Enviar Modificado</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Script at the end of body -->
    <script src="shared.js"></script>
    <script>
        let sandboxEventSource = null;
        let activeSandboxTransactions = [];
        let activeSandboxTxID = '';

        window.onPageInit = function() {
            initSandboxSSE();
            loadSandboxActive();
        };

        window.onPagePoll = function() {
            loadSandboxActive();
        };

        function initSandboxSSE() {
            if (sandboxEventSource) return;

            if (window.isDesignMode) {
                console.log("Mock EventSource active for Sandbox events.");
                // Simulação local periódica no Modo Design
                setInterval(() => {
                    if (activeSandboxTransactions.length < 5 && Math.random() > 0.75) {
                        const randomId = "tx-" + Math.floor(1000 + Math.random() * 9000);
                        const isReq = Math.random() > 0.5;
                        const tx = {
                            id: randomId,
                            method: ["GET", "POST", "PUT"][Math.floor(Math.random() * 3)],
                            isInbound: isReq,
                            status: isReq ? 0 : [200, 201, 400, 500][Math.floor(Math.random() * 4)],
                            domain: "api.sonic-gateway.io",
                            path: ["/api/v1/checkout", "/api/v1/auth/login", "/api/v1/users"][Math.floor(Math.random() * 3)],
                            headers: { "Content-Type": "application/json", "User-Agent": "Mozilla/5.0" },
                            body: isReq ? '{"item_id": 42, "qty": 1}' : '{"status":"ok", "message":"order processed"}'
                        };
                        addPausedTx(tx);
                    }
                }, 3000);
                loadSandboxConfig();
                return;
            }

            const token = sessionStorage.getItem('sonic_token');
            if (!token) return;

            sandboxEventSource = new EventSource(`/api/sandbox/events?token=${token}`);

            sandboxEventSource.addEventListener('request_paused', (e) => {
                const tx = JSON.parse(e.data);
                addPausedTx(tx);
            });

            sandboxEventSource.addEventListener('response_paused', (e) => {
                const tx = JSON.parse(e.data);
                addPausedTx(tx);
            });

            sandboxEventSource.addEventListener('request_timeout', (e) => {
                const { id } = JSON.parse(e.data);
                removePausedTx(id);
            });

            sandboxEventSource.addEventListener('response_timeout', (e) => {
                const { id } = JSON.parse(e.data);
                removePausedTx(id);
            });

            sandboxEventSource.onerror = () => {
                console.warn("SSE Connection lost. Retrying or doing polling fallback...");
            };

            loadSandboxConfig();
        }

        async function loadSandboxConfig() {
            const cfg = await window.fetchData('/api/sandbox/config');
            if (cfg) {
                document.getElementById('sandbox-active-check').checked = cfg.active;
                document.getElementById('sandbox-domains-input').value = cfg.enabledDomains ? cfg.enabledDomains.join(', ') : '';
            }
        }

        async function saveSandboxConfig() {
            const active = document.getElementById('sandbox-active-check').checked;
            const domainsStr = document.getElementById('sandbox-domains-input').value;
            const enabledDomains = domainsStr ? domainsStr.split(',').map(d => d.trim()) : [];

            const res = await fetch('/api/sandbox/config', {
                method: 'POST',
                headers: window.getHeaders(),
                body: JSON.stringify({ active, enabledDomains })
            });

            if (res.ok) {
                alert("Configuração do Sandbox guardada com sucesso.");
            } else {
                alert("Erro ao guardar configuração.");
            }
        }

        async function loadSandboxActive() {
            const list = await window.fetchData('/api/sandbox/active');
            if (list) {
                activeSandboxTransactions = list;
                renderSandboxTxList();
            }
        }

        function addPausedTx(tx) {
            if (!activeSandboxTransactions.some(x => x.id === tx.id)) {
                activeSandboxTransactions.push(tx);
                renderSandboxTxList();
                flashSandboxBadge();
            }
        }

        function removePausedTx(id) {
            activeSandboxTransactions = activeSandboxTransactions.filter(x => x.id !== id);
            renderSandboxTxList();
            if (activeSandboxTxID === id) {
                activeSandboxTxID = '';
                document.getElementById('sandbox-editor-panel').style.display = 'none';
            }
        }

        function flashSandboxBadge() {
            const badge = document.getElementById('sandbox-status-badge');
            if (badge) {
                badge.innerText = `${activeSandboxTransactions.length} INTERCEPTADO(S)`;
                badge.style.backgroundColor = '#ffffff';
                badge.style.color = '#000000';
                badge.style.borderColor = '#ffffff';
                setTimeout(() => {
                    badge.style.backgroundColor = 'transparent';
                    badge.style.color = 'var(--text-color)';
                    badge.style.borderColor = 'var(--border-color)';
                }, 1000);
            }
        }

        function renderSandboxTxList() {
            const container = document.getElementById('sandbox-tx-list');
            if (!container) return;

            const badge = document.getElementById('sandbox-status-badge');
            if (badge) {
                badge.innerText = activeSandboxTransactions.length > 0 
                    ? `${activeSandboxTransactions.length} INTERCEPTADO(S)` 
                    : 'A ESCUTAR TRÁFEGO...';
            }

            if (activeSandboxTransactions.length === 0) {
                container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 2rem 0; font-size: 0.9rem;">Nenhuma conexão pausada no momento.</div>`;
                return;
            }

            container.innerHTML = activeSandboxTransactions.map(tx => {
                const methodColor = tx.isInbound ? '#ffffff' : 'var(--text-muted)';
                const typeLabel = tx.isInbound ? 'REQ' : `RESP (${tx.status})`;
                const activeStyle = activeSandboxTxID === tx.id 
                    ? 'border-color: #ffffff; background: rgba(255, 255, 255, 0.05);' 
                    : 'border-color: var(--border-color);';

                return `
                    <div class="metric-card" style="cursor: pointer; padding: 0.75rem; border-radius: 5px; ${activeStyle}" onclick="selectSandboxTx('${tx.id}')">
                        <div style="display:flex; justify-content:space-between; font-size: 0.8rem;">
                            <span style="font-weight:bold; color: ${methodColor}">${tx.method} [${typeLabel}]</span>
                            <span style="color: var(--text-muted); font-family: monospace;">${tx.id}</span>
                        </div>
                        <div style="font-size:0.75rem; word-break:break-all; margin-top: 0.25rem;">Domain: ${window.escapeHTML(tx.domain)}</div>
                        <div style="font-size:0.75rem; color: var(--text-muted); text-overflow:ellipsis; overflow:hidden; white-space:nowrap;">Path: ${window.escapeHTML(tx.path || '/')}</div>
                    </div>
                `;
            }).join('');
        }

        function selectSandboxTx(id) {
            activeSandboxTxID = id;
            const tx = activeSandboxTransactions.find(x => x.id === id);
            if (!tx) return;

            document.getElementById('sb-active-id').innerText = tx.id;
            const typeBadge = document.getElementById('sb-active-type');
            if (typeBadge) {
                if (tx.isInbound) {
                    typeBadge.innerText = 'Inbound Request';
                    typeBadge.className = 'status-badge success';
                    document.getElementById('sb-direct-response-section').style.display = 'block';
                } else {
                    typeBadge.innerText = `Outbound Response (${tx.status})`;
                    typeBadge.className = 'status-badge error';
                    document.getElementById('sb-direct-response-section').style.display = 'none';
                }
            }

            document.getElementById('sb-method').value = tx.method;
            document.getElementById('sb-path').value = tx.path || '';
            document.getElementById('sb-headers').value = JSON.stringify(tx.headers || {}, null, 2);
            document.getElementById('sb-body').value = tx.body || '';

            document.getElementById('sb-use-direct-resp').checked = false;
            document.getElementById('sb-direct-fields').style.display = 'none';

            document.getElementById('sandbox-editor-panel').style.display = 'flex';
            renderSandboxTxList();
        }

        function toggleDirectResponseFields() {
            const useDirect = document.getElementById('sb-use-direct-resp').checked;
            document.getElementById('sb-direct-fields').style.display = useDirect ? 'flex' : 'none';
        }

        async function sandboxAction(action) {
            if (!activeSandboxTxID) return;

            let headers = {};
            try {
                headers = JSON.parse(document.getElementById('sb-headers').value);
            } catch (err) {
                alert("Erro ao processar cabeçalhos: Certifique-se que o JSON é válido.");
                return;
            }

            const body = document.getElementById('sb-body').value;
            const method = document.getElementById('sb-method').value;
            const path = document.getElementById('sb-path').value;

            const payload = {
                id: activeSandboxTxID,
                action: action,
                headers: headers,
                body: body,
                status: action === 'modify' ? parseInt(document.getElementById('sb-resp-status').value || '0') : 0
            };

            const useDirect = document.getElementById('sb-use-direct-resp').checked;
            if (useDirect && payload.action === 'modify') {
                payload.respDirect = {
                    status: parseInt(document.getElementById('sb-resp-status').value || '200'),
                    headers: { 'Content-Type': document.getElementById('sb-resp-type').value },
                    body: document.getElementById('sb-resp-body').value
                };
            }

            const res = await fetch('/api/sandbox/resume', {
                method: 'POST',
                headers: window.getHeaders(),
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                removePausedTx(activeSandboxTxID);
            } else {
                alert("Falha ao resumir breakpoint.");
            }
        }
    </script>
</body>
</html>
